<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="title desc">
  <title id="title">Ali Irzha — Geospatial and Full-Stack Software Engineer</title>
  <desc id="desc">Mobile layout of a light technical systems map connecting spatial data, field operations, scientific tools, and software systems.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#d8dee4"/>
    </pattern>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .motion { display: inline; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.6s ease-out infinite; }
      @keyframes pulse { 0% { opacity: .58; transform: scale(.45); } 72%, 100% { opacity: 0; transform: scale(1.75); } }
      @media (prefers-reduced-motion: reduce) { .motion { display: none; } .pulse { animation: none; opacity: .2; transform: none; } }
    </style>
  </defs>
  <rect width="720" height="700" fill="#ffffff"/>
  <rect x="1" y="1" width="718" height="698" fill="none" stroke="#d0d7de" stroke-width="2"/>
  <path d="M0 320H720" stroke="#d0d7de"/>

  <g class="sans">
    <text x="40" y="88" fill="#0d1117" font-size="54" font-weight="650" letter-spacing="7">ALI IRZHA</text>
    <text x="42" y="146" fill="#24292f" font-size="28">
      <tspan x="42" dy="0">Geospatial &amp; Full-Stack</tspan>
      <tspan x="42" dy="35">Software Engineer</tspan>
    </text>
    <text x="42" y="232" fill="#57606a" font-size="20">
      <tspan x="42" dy="0">Building reliable software for spatial data,</tspan>
      <tspan x="42" dy="30">field operations, and technical</tspan>
      <tspan x="42" dy="30">decision-making.</tspan>
    </text>
  </g>

  <g transform="translate(0 320)">
    <rect width="720" height="380" fill="url(#grid)" opacity=".72"/>
    <g class="mono" fill="#57606a" font-size="14" letter-spacing="1.2">
      <text x="54" y="48">SPATIAL DATA</text>
      <text x="502" y="48">FIELD OPERATIONS</text>
      <text x="54" y="334">SCIENTIFIC TOOLS</text>
      <text x="488" y="334">SOFTWARE SYSTEMS</text>
    </g>
    <g fill="none" stroke="#8c959f" stroke-width="1.5">
      <path d="M74 76H646V292H74Z"/>
      <path d="M74 184H646"/>
      <path d="M360 52V316"/>
      <path d="M74 292L148 226H360" opacity=".72"/>
    </g>
    <g fill="#ffffff" stroke="#24292f" stroke-width="2">
      <rect x="65" y="67" width="18" height="18"/>
      <rect x="637" y="67" width="18" height="18"/>
      <rect x="65" y="283" width="18" height="18"/>
      <rect x="637" y="283" width="18" height="18"/>
    </g>
    <g transform="translate(360 184)">
      <circle class="pulse" r="34" fill="none" stroke="#8b5cf6"/>
      <circle r="22" fill="#ffffff" stroke="#8c959f"/>
      <circle r="11" fill="#ffffff" stroke="#8b5cf6" stroke-width="4"/>
      <circle r="3" fill="#0d1117"/>
    </g>
    <path d="M30 184H690" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 7"/>
    <path d="M360 24V340" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="7 7"/>
    <g fill="none" stroke="#3b82f6" stroke-width="2"><path d="M430 176l8 8-8 8M446 176l8 8-8 8M462 176l8 8-8 8"/></g>
    <g fill="none" stroke="#8b5cf6" stroke-width="2"><path d="M352 236l8 8 8-8M352 252l8 8 8-8M352 268l8 8 8-8"/></g>
    <g class="motion">
      <rect x="30" y="175" width="18" height="18" fill="#3b82f6"><animateMotion path="M0 0 H642" dur="7s" repeatCount="indefinite"/></rect>
      <rect x="351" y="24" width="18" height="18" fill="#8b5cf6"><animateMotion path="M0 0 V298" dur="8.5s" begin="1s" repeatCount="indefinite"/></rect>
    </g>
  </g>
</svg>
